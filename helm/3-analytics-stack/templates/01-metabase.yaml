# ============================================================
# 01-metabase.yaml — Deployment de Metabase (BI Dashboards)
# ============================================================
# Metabase se conecta a Oracle ADB (data operacional) y a Trino
# (queries sobre el Lakehouse Iceberg). Su base de datos propia
# vive en el PostgreSQL de Aiven.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: personal-ai
  labels:
    app: metabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
      - name: metabase
        image: metabase/metabase:latest
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "1.5Gi"
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: JAVA_OPTS
          value: "-Xmx1024m"
        - name: MB_DB_TYPE
          value: "postgres"
        - name: MB_DB_DBNAME
          value: "defaultdb"
        - name: MB_DB_PORT
          value: "23645"
        - name: MB_SITE_URL
          value: "http://localhost:8081/metabase"
        - name: MB_DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: METABASE_DB_USER
        - name: MB_DB_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: METABASE_DB_PASS
        - name: MB_DB_HOST
          value: "pg-3ad5269f-bmo.d.aivencloud.com"

---
apiVersion: v1
kind: Service
metadata:
  name: metabase-service
  namespace: personal-ai
spec:
  selector:
    app: metabase
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000

---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: metabase-stripprefix
  namespace: personal-ai
spec:
  stripPrefix:
    prefixes:
      - /metabase

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metabase-ingress
  namespace: personal-ai
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: personal-ai-metabase-stripprefix@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /metabase
        pathType: Prefix
        backend:
          service:
            name: metabase-service
            port:
              number: 3000
