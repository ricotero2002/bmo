apiVersion: v2
name: analytics-stack
description: |
  Stack analítico del cluster BMO. Contiene Trino (motor de consultas
  distribuidas sobre el Lakehouse Iceberg) y Metabase (BI dashboards).
  Se activa con: skaffold run -p analytics  |  o botón "Play" en Tilt
type: application
version: 1.0.0
appVersion: "1.0.0"

# Trino y Metabase gestionados como sub-charts de Helm
dependencies:
  - name: trino
    version: "0.28.0"
    repository: "https://trinodb.github.io/charts"
    alias: trino
