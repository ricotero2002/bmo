# ============================================================
# 06-otel-rbac.yaml — RBAC para el Collector de OpenTelemetry
# ============================================================
# Permisos necesarios para que el OTEL Collector pueda descubrir
# pods y nodos del cluster para el scraping de métricas.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-discovery
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "nodes/stats", "nodes/proxy", "services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-discovery-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-discovery
subjects:
- kind: ServiceAccount
  name: otel-collector-opentelemetry-collector
  namespace: observability
