# k8s/lakehouse/trino-values.yaml
# Trino Helm Chart Values
# https://github.com/trinodb/charts/tree/main/charts/trino

image:
  tag: "451"

coordinator:
  jvm:
    maxHeapSize: "512M"
  config:
    query:
      maxMemory: "400MB"
      maxMemoryPerNode: "300MB"
      # La query espera hasta 5 min antes de fallar — da tiempo a KEDA para levantar workers (Fase 2)
      maxQueuedTime: "5m"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

worker:
  jvm:
    maxHeapSize: "400M"
  config:
    query:
      maxMemory: "400MB"
      maxMemoryPerNode: "250MB"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "768Mi"
  # Escalado a cero habilitado: KEDA toma el control
  replicas: 0
  autoscaling:
    enabled: false

# Inyectar secretos de OCI/S3 para que esten disponibles como variables de entorno
env:
  - name: OCI_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: OCI_ACCESS_KEY
  - name: OCI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: OCI_SECRET_KEY
  - name: OCI_REGION
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: OCI_REGION
  - name: OCI_NAMESPACE
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: OCI_NAMESPACE

# Catalogo Iceberg REST
additionalCatalogs:
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://iceberg-rest-svc.personal-ai.svc.cluster.local:8181
    iceberg.rest-catalog.warehouse=s3://bmo-documents/warehouse/
    fs.native-s3.enabled=true
    # Construimos el endpoint dinamicamente usando las variables de entorno
    s3.endpoint=https://${ENV:OCI_NAMESPACE}.compat.objectstorage.${ENV:OCI_REGION}.oraclecloud.com
    s3.region=${ENV:OCI_REGION}
    s3.path-style-access=true
    s3.aws-access-key=${ENV:OCI_ACCESS_KEY}
    s3.aws-secret-key=${ENV:OCI_SECRET_KEY}
