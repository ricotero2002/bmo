apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-thrift
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-thrift
  template:
    metadata:
      labels:
        app: spark-thrift
    spec:
      containers:
      - name: spark-thrift
        image: tabulario/spark-iceberg:latest
        ports:
        - containerPort: 10000
        - containerPort: 4040
        envFrom:
        - secretRef:
            name: app-secrets
        command: ["/bin/bash", "-c"]
        args:
          - |
            /opt/spark/bin/spark-submit \
            --master local[*] \
            --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2 \
            --name "Spark Thrift Server" \
            --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
            --conf spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog \
            --conf spark.sql.catalog.lakehouse.type=rest \
            --conf spark.sql.catalog.lakehouse.uri=http://iceberg-rest-svc.personal-ai.svc.cluster.local:8181 \
            --conf spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO \
            --conf spark.sql.catalog.lakehouse.s3.endpoint=https://${OCI_NAMESPACE}.compat.objectstorage.${OCI_REGION}.oraclecloud.com \
            --conf spark.sql.catalog.lakehouse.s3.path-style-access=true \
            --conf spark.sql.catalog.lakehouse.s3.access-key-id=${OCI_ACCESS_KEY} \
            --conf spark.sql.catalog.lakehouse.s3.secret-access-key=${OCI_SECRET_KEY} \
            --conf spark.sql.defaultCatalog=lakehouse \
            --conf spark.hadoop.fs.s3a.endpoint=https://${OCI_NAMESPACE}.compat.objectstorage.${OCI_REGION}.oraclecloud.com \
            --conf spark.hadoop.fs.s3a.access.key=${OCI_ACCESS_KEY} \
            --conf spark.hadoop.fs.s3a.secret.key=${OCI_SECRET_KEY} \
            --conf spark.hadoop.fs.s3a.path.style.access=true \
            --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
            spark-internal
        resources:
          requests:
            cpu: "200m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-thrift-svc
  namespace: personal-ai
spec:
  selector:
    app: spark-thrift
  ports:
  - name: thrift
    port: 10000
    targetPort: 10000
  - name: spark-ui
    port: 4040
    targetPort: 4040
