apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
      - name: bmo-lakehouse-superset
        image: apache/superset:latest
        ports:
        - containerPort: 8088
        env:
        - name: SUPERSET_SECRET_KEY
          value: "bmo-secret-key-lakehouse-123" # Debería ir en un secret en prod
        - name: TALISMAN_ENABLED
          value: "False"
        # Configuración básica para iniciar
        command: ["/bin/sh", "-c"]
        args:
          - |
            superset db upgrade
            superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin
            superset init
            /usr/bin/run-server.sh --host 0.0.0.0 --port 8088 --with-threads --reload
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: superset-svc
  namespace: personal-ai
spec:
  selector:
    app: superset
  ports:
  - port: 8088
    targetPort: 8088
