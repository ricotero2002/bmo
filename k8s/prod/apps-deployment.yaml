# 1. Namespace para organizar todo
apiVersion: v1
kind: Namespace
metadata:
  name: personal-ai

---
# 2. Service Interno para FastAPI
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: personal-ai
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000

---
# 3. Ingress: La puerta de entrada al clúster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: personal-ai
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80

---
# 4. Deployment de FastAPI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: api
        image: personal_ai_api:latest
        imagePullPolicy: Never
        # EL ARREGLO DEL COMANDO: Quitamos el limit-concurrency 15 (ahora lo maneja el Semáforo interno)
        command: [
          "uvicorn", 
          "src.api.main:app", 
          "--host", "0.0.0.0", 
          "--port", "8000", 
          "--workers", "2"
        ]
        # EL ARREGLO DE LOS RECURSOS: Estrategia VIP v2 (RAM segura para el Semáforo)
        resources:
          requests:
            cpu: "150m"
            memory: "350Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: app-secrets   # Infisical: DB_HOST, DB_USER, DB_PASSWORD, DB_SERVICE_NAME,
                                 # PINECONE_API_KEY, OCI_*, CELERY_BROKER_URL, REDIS_URL, etc.
        - configMapRef:
            name: app-config    # APP_ENV, DB_PORT, COLLECTION_NAME, OTEL_*
        env:
          - name: OTEL_SERVICE_NAME
            value: "personal-ai-api"
          - name: KAFKA_SSL_CA_LOCATION
            value: "/etc/kafka/certs/ca.pem"
        volumeMounts:
          - name: kafka-ca-cert
            mountPath: /etc/kafka/certs
            readOnly: true
      volumes:
        - name: kafka-ca-cert
          secret:
            secretName: kafka-ca-cert

---
# 5. Deployment del Worker (Lo que KEDA va a escalar)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: worker
        image: personal_ai_worker:latest
        imagePullPolicy: Never
        command: ["celery", "-A", "src.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-E"]
        resources:
          requests:
            cpu: "50m"
            memory: "200Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        env:
          - name: OTEL_SERVICE_NAME
            value: "bmo"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-exporter
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-exporter
  template:
    metadata:
      labels:
        app: celery-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9808"
    spec:
      containers:
      - name: exporter
        image: danihodovic/celery-exporter:latest
        ports:
        - containerPort: 9808
          name: metrics
        env:
        - name: CE_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CELERY_BROKER_URL
        - name: CE_RETRY_INTERVAL
          value: "5"
---
apiVersion: v1
kind: Service
metadata:
  name: celery-exporter-service
  namespace: personal-ai
  labels:
    app: celery-exporter
spec:
  selector:
    app: celery-exporter
  ports:
  - name: metrics
    port: 9808
    targetPort: 9808
  type: ClusterIP
