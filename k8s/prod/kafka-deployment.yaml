# k8s/prod/kafka-deployment.yaml
# Deployment del consumidor Kafka para Aiven (producci\u00f3n cloud)
# KEDA escala este deployment segun el consumer lag en el topic raw-documents
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-deployment
  namespace: personal-ai
spec:
  replicas: 1  # KEDA lo manejará vía KafkaTrigger
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      hostAliases:
      - ip: "172.19.0.1"
        hostnames:
        - "host.k3d.internal"
      - ip: "172.30.16.1"
        hostnames:
        - "ollama.host.internal"
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: kafka-consumer
        image: personal_ai_worker:latest
        imagePullPolicy: Never
        command: ["python", "-m", "src.workers.kafka_consumer"]
        resources:
          requests:
            cpu: "50m"
            memory: "150Mi"
          limits:
            cpu: "300m"
            memory: "350Mi"
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        env:
          # --- AGREGAR ESTO PARA KEDA ---
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: KAFKA_BOOTSTRAP_SERVERS
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: KAFKA_SASL_USERNAME
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: KAFKA_SASL_PASSWORD
          # ------------------------------
          - name: OTEL_SERVICE_NAME
            value: "kafka-consumer"
          - name: OPENSSL_CONF
            value: "/app/docker/openssl/openssl.cnf"
          - name: OPENSSL_MODULES
            value: "/usr/lib/x86_64-linux-gnu/ossl-modules"
          - name: KAFKA_SSL_PROVIDER
            value: "legacy"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: KAFKA_GROUP_ID
            value: "document-ingestor-v4"
          - name: KAFKA_SSL_CA_LOCATION
            value: "/etc/kafka/certs/ca.pem"
        volumeMounts:
        - name: kafka-ca-cert
          mountPath: /etc/kafka/certs
          readOnly: true
      volumes:
      - name: kafka-ca-cert
        secret:
          secretName: kafka-ca-cert

