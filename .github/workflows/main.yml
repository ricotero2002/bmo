name: Main CI/CD - Production Smoke Tests

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build_and_smoke_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Obtener secretos de Infisical
      uses: Infisical/secrets-action@v1.0.8
      with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "bmo-ai-assistant-qd7o"
          secret-path: "/"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/local.txt
        
    - name: Smoke Tests (Ensure API starts with Cloud Storage settings)
      env:
        USE_CLOUD_STORAGE: "True"
        INTEGRATION_ENV: "cloud"
        APP_ENV: "production"
      run: |
        # Probamos únicamente que todos los tests unitarios (mockeados al 100%) corran bajo configuración CLOUD
        # No corremos los integration tests acá porque usarían los testcontainers locales y no las BD Cloud reales.
        pytest src/tests/unit/
        pytest src/tests/integration/test_all_endpoints_cloud.py -v --tb=short
        
    - name: Build Docker Image
      run: |
        cd docker
        docker compose build
