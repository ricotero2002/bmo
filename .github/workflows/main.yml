name: Main CI/CD - Production Smoke Tests

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build_and_smoke_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Smoke Tests (Ensure API starts with Cloud Storage settings)
      env:
        USE_CLOUD_STORAGE: "True"
        GOOGLE_API_KEY: "fake_google_key"
        OPENAI_API_KEY: "fake_openai_key"
        OPENWEATHERMAP_API_KEY: "fake_weather_key"
        # Secretos de DB simulados para que inicie la API y chequeemos sintaxis
        AURA_URI: "neo4j+s://fake.databases.neo4j.io"
        AURA_USER: "neo4j"
        AURA_PASSWORD: "fake"
      run: |
        # Probamos únicamente que todos los tests unitarios (mockeados al 100%) corran bajo configuración CLOUD
        # No corremos los integration tests acá porque usarían los testcontainers locales y no las BD Cloud reales.
        pytest src/tests/unit/
        
    - name: Build Docker Image
      run: |
        cd docker
        docker compose build
