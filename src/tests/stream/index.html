<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test de Streaming AI</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background: #1e1e1e;
            color: #fff;
            max-width: 800px;
            margin: 0 auto;
        }

        .controls {
            background: #2d2d2d;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input,
        button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #333;
            color: white;
            font-size: 16px;
        }

        button {
            background: #4ade80;
            color: #1e1e1e;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #38bdf8;
        }

        #chat {
            border: 1px solid #444;
            padding: 1rem;
            min-height: 200px;
            margin-top: 1rem;
            white-space: pre-wrap;
            border-radius: 8px;
            background: #222;
        }

        .status {
            color: #888;
            font-style: italic;
        }

        .token {
            color: #4ade80;
        }
    </style>
</head>

<body>
    <h2>Prueba de Agente (Streaming)</h2>

    <div class="controls">
        <div class="input-group">
            <label for="thread_id">Thread ID:</label>
            <input type="text" id="thread_id" value="test-123" placeholder="Ej: test-123">
        </div>
        <div class="input-group">
            <label for="user_id">Usuario (Opcional):</label>
            <input type="text" id="user_id" value="" placeholder="Ej: Agustin">
        </div>
        <div class="input-group">
            <label for="query">Pregunta:</label>
            <input type="text" id="query" value="Decime la temperatura en Buenos Aires y cuánto es 2 + 2."
                placeholder="Escribe tu pregunta aquí...">
        </div>
        <button onclick="iniciarChat()">Preguntar al Agente</button>
    </div>

    <div id="chat"></div>

    <script>
        async function iniciarChat() {
            const chatDiv = document.getElementById('chat');
            const threadId = document.getElementById('thread_id').value || 'test-123';
            const userId = document.getElementById('user_id').value;
            const query = document.getElementById('query').value;

            chatDiv.innerHTML = ''; // Limpiar chat

            const bodyData = {
                message: query,
                thread_id: threadId,
                prompt_version: "rag_v2",
                user_info: {}
            };

            if (userId) {
                bodyData.user_info.user_id = userId;
            }

            // 1. Hacemos el POST con Fetch
            try {
                const response = await fetch('http://localhost:8001/api/ask/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) {
                    chatDiv.innerHTML = `<span style="color: red;">Error HTTP: ${response.status}</span>`;
                    return;
                }

                // 2. Leemos el stream de datos a medida que llega
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    // Decodificamos los bytes a texto
                    const chunkText = decoder.decode(value);

                    // Como los datos vienen en formato SSE ("data: {...}\n\n"), los limpiamos
                    const lineas = chunkText.split('\n');

                    for (let linea of lineas) {
                        if (linea.startsWith('data: ')) {
                            const jsonStr = linea.replace('data: ', '').trim();
                            if (!jsonStr) continue;

                            try {
                                const data = JSON.parse(jsonStr);

                                // Si es un estado (buscando en DB, etc)
                                if (data.type === 'status') {
                                    chatDiv.innerHTML += `<span class="status">[${data.content}]</span><br>`;
                                }
                                // Si es un token del LLM
                                else if (data.type === 'token') {
                                    chatDiv.innerHTML += `<span class="token">${data.content}</span>`;
                                }
                            } catch (e) {
                                console.error("Error parseando JSON:", e);
                            }
                        }
                    }
                }
            } catch (error) {
                chatDiv.innerHTML = `<span style="color: red;">Error de conexión: ${error.message}</span>`;
            }
        }
    </script>
</body>

</html>
