version: 2

sources:
  - name: lakehouse_gold
    schema: gold
    tables:
      - name: agent_evaluations
        description: "Evaluaciones de calidad (LLM-as-a-Judge) generadas por Spark Evaluator."

  - name: lakehouse_bronze
    description: "Capa cruda (Raw) almacenada en formato Iceberg en MinIO."
    schema: bronze
    tables:
      - name: raw_llm_traces
        description: "Telemetría cruda ingerida desde el CSV de LangSmith o MLflow."
        tests:
          - dbt_utils.expression_is_true:
              expression: "total_tokens >= 0"
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: "latency_ms >= 0"
              config:
                severity: warn
        columns:
          - name: run_id
            description: "ID único de la ejecución"
            tests:
              - unique
              - not_null
          - name: date
            description: "Fecha de partición YYYY-MM-DD"
          - name: start_time
            description: "Timestamp de inicio de la ejecución"
            tests:
              - not_null
          - name: status
            description: "Estado de ejecución"
            tests:
              - not_null
          - name: error_message
            description: "Mensaje de error si falló"
          - name: latency_ms
            description: "Latencia en milisegundos"
          - name: prompt_tokens
          - name: completion_tokens
          - name: total_tokens
          - name: total_cost_usd
          - name: inputs_json
            description: "Inputs de la ejecución en formato JSON"
          - name: outputs_json
            description: "Outputs de la ejecución en formato JSON"
          - name: tools_used
            description: "Lista de herramientas usadas en formato JSON"
          - name: ingested_at
            description: "Timestamp de ingesta en el Lakehouse"