services:
  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: bmo_lakehouse_spark
    depends_on:
      - minio
      - rest
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lakehouse123}
      AWS_REGION: us-east-1
    volumes:
      - ../lakehouse/warehouse:/home/iceberg/warehouse
      - ../lakehouse/notebooks:/home/iceberg/notebooks/notebooks
    ports:
      - "8888:8888"
      - "8080:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: bmo_lakehouse_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakehouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehouse123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: bmo_lakehouse_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakehouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehouse123}
    entrypoint: >
      /bin/sh -c "
      set -e;
      i=0;
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then
          echo 'MinIO no estuvo disponible luego de 30 intentos';
          exit 1;
        fi;
        echo 'Esperando MinIO... intento' $$i;
        sleep 2;
      done;
      mc mb -p local/bronze;
      mc mb -p local/silver;
      mc mb -p local/gold;
      mc mb -p local/warehouse;
      echo 'Buckets bronze/silver/gold/warehouse creados';
      "
    restart: "no"

  rest:
    image: tabulario/iceberg-rest:latest
    container_name: bmo_lakehouse_rest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lakehouse123}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    restart: unless-stopped

volumes:
  minio-data:
